apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandav-ai-core
  namespace: pandav-system
  labels:
    app: pandav-ai
    tier: control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pandav-ai
  template:
    metadata:
      labels:
        app: pandav-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: pandav-core
          image: pandav/pandav-ai:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pandav-ai-service
  namespace: pandav-system
spec:
  type: ClusterIP
  selector:
    app: pandav-ai
  ports:
    - port: 80
      targetPort: 3000
