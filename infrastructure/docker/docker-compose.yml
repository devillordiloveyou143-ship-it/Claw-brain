version: '3.8'

services:
  pandav-core:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: pandav-core
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://pandav:secure_pass@postgres:5432/pandav_db
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pandav-postgres
    environment:
      - POSTGRES_USER=pandav
      - POSTGRES_PASSWORD=secure_pass
      - POSTGRES_DB=pandav_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pandav-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: pandav-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
